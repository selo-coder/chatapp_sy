commit-msg:
  commands:
    "lint commit message":
      run: yarn commitlint --color -V --edit {1}

pre-push:
  parallel: true
  commands:
    lint:
      run: yarn lint
    test:
      run: yarn test
    tscheck:
      run: yarn tsc
